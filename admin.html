<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANTARA Admin</title><link rel="stylesheet" href="style.css"></head><body><section><h1>VANTARA Admin</h1><input id="k" type="password" placeholder="ADMIN_KEY"><button class="btn" id="go">Load Subscribers</button><div id="out"></div><script>go.onclick=async()=>{let r=await fetch('/api/admin-subscribers',{headers:{'x-admin-key':k.value}}),d=await r.json();out.innerHTML=r.ok?'<h2>Subscribers: '+d.length+'</h2>'+d.map(x=>'<p>'+x.email+' — '+x.subscribed+'</p>').join(''):'<p>'+d.message+'</p>'}</script></section></body></html>
