<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #080808;
  color: #ffffff;
  min-height: 100vh;
}

header {
  background: #111;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #333;
}

header h1 {
  font-size: 28px;
  letter-spacing: 2px;
}

header p {
  color: #aaa;
  margin-top: 6px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px 15px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h2 {
  margin-bottom: 20px;
  font-size: 25px;
}

h3 {
  margin: 20px 0 12px;
  color: #ddd;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
}

button {
  width: 100%;
  padding: 16px;
  border: 1px solid #333;
  border-radius: 12px;
  background: #151515;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #222;
  transform: translateY(-2px);
}

.back {
  background: #222;
  margin-bottom: 20px;
}

.chapter {
  text-align: left;
  padding: 15px;
}

.chapter-title {
  font-size: 17px;
}

.chapter-number {
  color: #aaa;
  font-size: 13px;
}

.content-box {
  background: #111;
  border: 1px solid #292929;
  padding: 20px;
  border-radius: 14px;
  line-height: 1.7;
}

footer {
  text-align: center;
  color: #777;
  padding: 30px 10px;
  margin-top: 30px;
  border-top: 1px solid #222;
}

.small {
  color: #999;
  font-size: 14px;
  margin-bottom: 15px;
}

.section-title {
  margin-top: 25px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #333;
}

.home-btn {
  background: #1c1c1c;
}

textarea {
  width: 100%;
  min-height: 200px;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 15px;
  resize: vertical;
}

.save-btn {
  margin-top: 10px;
  background: #222;
}

@media(max-width:600px) {
  header h1 {
    font-size: 23px;
  }

  h2 {
    font-size: 21px;
  }

  button {
    font-size: 15px;
    padding: 14px;
  }
}
</style>
</head>

/* =========================
   NAVIGATION
========================= */

function showPage(id) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  window.scrollTo(0, 0);
}


function openClass(classNumber) {

  selectedClass = classNumber;

  document.getElementById("classTitle").textContent =
    "Class " + classNumber;

  const box = document.getElementById("subjectButtons");

  box.innerHTML = "";

  classes[classNumber].forEach(subject => {

    const button = document.createElement("button");

    button.textContent = subject;

    if (subject === "Social Science") {
      button.onclick = openSST;
    } else {
      button.onclick = () => openSubject(subject);
    }

    box.appendChild(button);
  });

  showPage("classPage");
}


/* =========================
   SST
========================= */

function openSST() {

  if (selectedClass >= 9 && selectedClass <= 12) {

    const box = document.getElementById("sstOptions");

    box.innerHTML = "";

    ["History", "Geography", "Civics", "Economics"].forEach(subject => {

      const button = document.createElement("button");

      button.textContent = subject;

      button.onclick = () => {

        let chapters = [];

        if (selectedClass === 9) {

          if (subject === "History") chapters = class9HistoryOld;
          if (subject === "Geography") chapters = class9GeographyOld;
          if (subject === "Civics") chapters = class9CivicsOld;
          if (subject === "Economics") chapters = class9EconomicsOld;

        } else {

          chapters = Array.from(
            {length: 10},
            (_, i) => "Chapter " + (i + 1)
          );

        }

        openChapterList(
          subject,
          chapters
        );
      };

      box.appendChild(button);
    });

    showPage("sstPage");

  } else {

/* =========================
   SUBJECT HANDLER
========================= */

function openSubject(subject) {

  currentSubject = subject;
  previousPage = "classPage";

  /* CLASS 9 SPECIAL SUBJECTS */

  if (selectedClass === 9) {

    if (subject === "Mathematics") {
      openClass9Math();
      return;
    }

    if (subject === "Science") {
      openClass9Science();
      return;
    }

    if (subject === "English") {
      openClass9English();
      return;
    }

    if (subject === "Hindi") {
      openClass9Hindi();
      return;
    }

    if (subject === "AI") {
      openChapterList(subject, class9AI);
      return;
    }
  }


  /* CLASS 10 SPECIAL SUBJECTS */

  if (selectedClass === 10) {

    if (subject === "Mathematics") {
      openChapterList(subject, class10Maths);
      return;
    }

    if (subject === "Science") {
      openChapterList(subject, class10Science);
      return;
    }

    if (subject === "AI") {
      openChapterList(subject, class10AI);
      return;
    }

    if (subject === "Hindi") {
      openClass10Hindi();
      return;
    }
  }


  /* GENERIC */

  const chapters = Array.from(
    {length: 10},
    (_, i) => "Chapter " + (i + 1)
  );

  openChapterList(subject, chapters);
}
