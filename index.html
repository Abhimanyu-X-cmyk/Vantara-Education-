<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTARA EDUCATION</title>

<style>
:root{
  --bg:#0b0b0f;
  --card:#15151c;
  --card2:#1c1c25;
  --text:#f5f5f7;
  --muted:#a7a7b2;
  --accent:#8b5cf6;
  --border:#292934;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:rgba(11,11,15,.96);
  z-index:5;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  color:var(--muted);
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

h2{
  margin-top:0;
}

.subtitle{
  color:var(--muted);
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
}

button{
  width:100%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:15px;
  border-radius:12px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:var(--card2);
  border-color:var(--accent);
}

.back{
  width:auto;
  background:transparent;
  margin-bottom:16px;
  padding:9px 14px;
}

.section-title{
  margin:25px 0 10px;
  color:#d7c8ff;
}

.chapter{
  display:flex;
  align-items:center;
  gap:10px;
}

.chapter span{
  flex:1;
}

.video-box{
  margin-top:20px;
  background:var(--card);
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
}

.video-box iframe{
  width:100%;
  height:420px;
  border:0;
  border-radius:10px;
}

.video-placeholder{
  padding:35px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:10px;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#241b38;
  color:#d9c8ff;
  font-size:12px;
  margin-bottom:10px;
}

footer{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

@media(max-width:600px){
  main{
    padding:14px;
  }

  header h1{
    font-size:23px;
  }

  .video-box iframe{
    height:230px;
  }
}
</style>
</head>

<body>

<header>
  <h1>VANTARA EDUCATION</h1>
  <p>Classes 8–10 • Learning Resources</p>
</header>

<main>

<!-- HOME -->
<section id="home" class="page active">

  <h2>Choose Class</h2>

  <p class="subtitle">
    Select a class to explore subjects and books.
  </p>

  <div class="grid" id="classGrid"></div>

</section>


<!-- SUBJECT PAGE -->
<section id="subjectPage" class="page">

  <button class="back" onclick="goBack()">← Back</button>

  <span class="badge" id="classBadge"></span>

  <h2 id="subjectTitle"></h2>

  <p class="subtitle">
    Choose a subject.
  </p>

  <div class="grid" id="subjectGrid"></div>

</section>


<!-- BOOK PAGE -->
<section id="bookPage" class="page">

  <button class="back" onclick="goBack()">← Back</button>

  <span class="badge" id="bookBadge"></span>

  <h2 id="bookTitle"></h2>

  <p class="subtitle" id="bookSubtitle"></p>

  <div class="grid" id="bookGrid"></div>

</section>


<!-- CHAPTER PAGE -->
<section id="chapterPage" class="page">

  <button class="back" onclick="goBack()">← Back</button>

  <span class="badge" id="chapterBadge"></span>

  <h2 id="chapterTitle"></h2>

  <p class="subtitle" id="chapterSubtitle"></p>

  <div id="chapterContent"></div>

</section>

</main>


<footer>
